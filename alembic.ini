[alembic]
script_location = migrations
prepend_sys_path = .
# Explicit: the endpoint that compares revisions reads this file on every process
# start, and alembic warns that the legacy space/comma/colon split goes away.
path_separator = os
file_template = %%(rev)s_%%(slug)s

# Deliberately empty: migrations/env.py reads DATABASE_URL from the environment so
# that no connection string ever lands in a tracked file.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
