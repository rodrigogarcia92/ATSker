[project]
name = "atsker"
version = "0.1.0"
description = "Private two-user résumé/JD fit evaluator with traceable scoring"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "pdfplumber>=0.11.10",
    "python-docx>=1.1",
]

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
    "pytest>=8.2",
    "reportlab>=5.0.1",
    "ruff>=0.5",
]

# Application code is imported from the working directory, not installed into
# site-packages: the container and the repo use the same `src.web.main:app` path.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
