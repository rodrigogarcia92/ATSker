name: deploy

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# A deploy interrupted midway leaves the service on a half-updated revision, so
# a queued run waits rather than cancelling the one in flight.
concurrency:
  group: deploy-default-branch
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # Workload Identity Federation, no downloadable key (build steps E8)

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Test
        # Offline by construction: the suite stubs the provider and runs against an
        # in-memory database, so it needs no DATABASE_URL and no OpenRouter key (G.2).
        run: uv run pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ secrets.GCP_REGION }}
      IMAGE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/atsker/app:${{ github.sha }}
      RUNTIME_SERVICE_ACCOUNT: atsker-runtime@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com

    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Build image
        run: docker build --tag "$IMAGE" .

      - name: Push image
        run: |
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker push "$IMAGE"

      - name: Deploy to Cloud Run
        # OPENROUTER_MODEL is a model name, not a secret, so it rides in the
        # Chosen 2026-09-25 on the golden set (docs/ATSker_state.md); reasoning low; w4 was measured with exactly this.
        run: |
          gcloud run deploy atsker \
            --image="$IMAGE" \
            --region="${GCP_REGION}" \
            --platform=managed \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=2 \
            --cpu=1 \
            --memory=512Mi \
            --timeout=300 \
            --service-account="${RUNTIME_SERVICE_ACCOUNT}" \
            --set-env-vars=ENV=production,OPENROUTER_MODEL=google/gemini-3.8-flash,OPENROUTER_REASONING_EFFORT=low \
            --set-secrets=OPENROUTER_API_KEY=openrouter-api-key:latest,DATABASE_URL=neon-database-url:latest,SESSION_SECRET=session-secret:latest

      - name: Report service URL
        run: |
          gcloud run services describe atsker \
            --region="${GCP_REGION}" \
            --format='value(status.url)'
