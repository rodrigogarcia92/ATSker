{% extends "base.html" %}
{% block title %}{{ t('login.title', lang) }} — {{ t('app.name', lang) }}{% endblock %}
{% block content %}
<div class="mx-auto max-w-sm">
  <h1 class="text-2xl font-semibold tracking-tight">{{ t('app.name', lang) }}</h1>
  <p class="mb-6 mt-1 text-sm text-slate-600">{{ t('app.tagline', lang) }}</p>

  {% if error %}
  <p class="mb-4 rounded border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-800">{{ error }}</p>
  {% endif %}

  <form method="post" action="/login" class="space-y-4 rounded-lg border border-slate-200 bg-white p-5">
    <div>
      <label for="email" class="mb-1 block text-sm font-medium">{{ t('login.email', lang) }}</label>
      <input id="email" name="email" type="email" required autofocus autocomplete="username"
             class="w-full rounded border border-slate-300 px-3 py-2 focus:border-slate-500 focus:outline-none">
    </div>
    <div>
      <label for="password" class="mb-1 block text-sm font-medium">{{ t('login.password', lang) }}</label>
      <input id="password" name="password" type="password" required autocomplete="current-password"
             class="w-full rounded border border-slate-300 px-3 py-2 focus:border-slate-500 focus:outline-none">
    </div>
    <button type="submit"
            class="w-full rounded bg-slate-900 px-3 py-2 font-medium text-white hover:bg-slate-800">
      {{ t('login.submit', lang) }}
    </button>
  </form>
</div>
{% endblock %}
