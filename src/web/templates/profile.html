{% extends "base.html" %}
{% block title %}{{ t('profile.title', lang) }} — {{ t('app.name', lang) }}{% endblock %}
{% block content %}
<h1 class="text-2xl font-semibold tracking-tight">{{ t('profile.title', lang) }}</h1>
<dl class="mt-6 rounded-lg border border-slate-200 bg-white p-5">
  <dt class="text-sm text-slate-600">{{ t('profile.display_name', lang) }}</dt>
  <dd class="mt-1 font-medium">{{ profile.display_name }}</dd>
</dl>
{% endblock %}
